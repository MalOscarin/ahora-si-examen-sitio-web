<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Tailwind Ejercicios</h1>
    <nav class="md:flex hidden space-x-4">
      <a href="#btn" class="hover:text-blue-500">Botón</a>
      <a href="#card" class="hover:text-blue-500">Tarjeta</a>
      <a href="#layout" class="hover:text-blue-500">Layout</a>
      <a href="#form" class="hover:text-blue-500">Formulario</a>
    </nav>
    <div class="md:hidden">
      <button id="menuBtn" class="text-gray-700 focus:outline-none">
        ☰
      </button>
    </div>
  </header>
  <div id="mobileMenu" class="md:hidden hidden bg-white px-4 pb-4">
    <a href="#btn" class="block py-1">Botón</a>
    <a href="#card" class="block py-1">Tarjeta</a>
    <a href="#layout" class="block py-1">Layout</a>
    <a href="#form" class="block py-1">Formulario</a>
  </div>

  <section id="btn" class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Botón Hover</h2>
    <button class="bg-blue-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
      Pasa el cursor
    </button>
  </section>

  <section id="card" class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Tarjeta de Usuario</h2>
    <div class="bg-white rounded-lg shadow-md p-4 max-w-sm">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSj9sFFtAqQICPyMc2CVR2UurigA_kya6WILg&s" alt="Usuario" class="rounded-full w-24 h-24 mx-auto mb-4">
      <h3 class="text-xl font-bold text-center">Juan Pérez</h3>
      <p class="text-gray-600 text-center mt-2">Desarrollador web apasionado por el diseño y la tecnología.</p>
    </div>
  </section>

  <section id="layout" class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Layout Responsivo</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded shadow">Columna 1</div>
      <div class="bg-white p-4 rounded shadow">Columna 2</div>
    </div>
  </section>

  <section id="form" class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Formulario</h2>
    <form class="bg-white p-6 rounded shadow max-w-md">
      <label class="block mb-2 font-medium">Nombre</label>
      <input type="text" class="w-full p-2 border rounded mb-4" placeholder="Tu nombre">
      <label class="block mb-2 font-medium">Email</label>
      <input type="email" class="w-full p-2 border rounded mb-4" placeholder="tucorreo@example.com">
      <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
        Enviar
      </button>
    </form>
  </section>

</body>
</html>
